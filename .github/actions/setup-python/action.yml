name: Setup Python
description: Checkout and setup Python environment

inputs:
  python-version:
    description: Python version
    required: false
    default: "3.12"

runs:
  using: composite

  steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Print Python Version
      shell: bash
      run: python --version
