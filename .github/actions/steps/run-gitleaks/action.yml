name: Run Gitleaks
description: Install Gitleaks, scan, and generate HTML report

runs:
  using: composite

  steps:
    - uses: actions/checkout@v4
    - name: Install Gitleaks
      shell: bash
      run: |
        set -e
        curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
        tar -xzf /tmp/gitleaks.tar.gz -C /tmp
        chmod +x /tmp/gitleaks
        sudo install /tmp/gitleaks /usr/local/bin/gitleaks
        gitleaks version

    - name: Run Gitleaks Scan
      shell: bash
      run: |
        mkdir -p reports
        gitleaks detect --source . --report-format json --report-path reports/gitleaks.json --no-git
        gitleaks detect --source . --report-format sarif --report-path reports/gitleaks.sarif --no-git

    - name: Create Gitleaks HTML Report
      shell: bash
      run: |
        mkdir -p reports
        if [ -f reports/gitleaks.json ]; then
          python3 "${{ github.action_path }}/../generate_gitleaks_report.py"
          cd reports
          zip -r gitleaks-report.zip gitleaks-report.html
          ls -R .
        fi

    - name: Upload HTML Report
      uses: actions/upload-artifact@v4
      with:
        name: gitleaks-html-report
        path: |
          reports/gitleaks-report.html
          reports/gitleaks-report.zip
