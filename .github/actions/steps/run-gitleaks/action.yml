name: Run Gitleaks
description: Install Gitleaks, scan, and generate HTML report

runs:
  using: composite

  steps:
    - uses: actions/checkout@v4

    - name: Install Gitleaks
      shell: bash
      run: |
        set -e
        curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
        tar -xzf /tmp/gitleaks.tar.gz -C /tmp
        chmod +x /tmp/gitleaks
        sudo install /tmp/gitleaks /usr/local/bin/gitleaks
        gitleaks version

    - name: Run Gitleaks Scan
      shell: bash
      run: |
        mkdir -p reports
        gitleaks detect --source . --report-format json --report-path reports/gitleaks.json --no-git
        gitleaks detect --source . --report-format sarif --report-path reports/gitleaks.sarif --no-git

    - name: Create Gitleaks HTML Report
      shell: bash
      run: |
        mkdir -p reports
        if [ -f reports/gitleaks.json ]; then
          python3 - <<'PYTHON'
import json
from pathlib import Path

report_path = Path("reports/gitleaks.json")
html_path = Path("reports/gitleaks-report.html")
findings = []

if report_path.exists():
    data = json.loads(report_path.read_text())
    findings = data if isinstance(data, list) else data.get("findings", [])

rows = "".join(
    "<tr>"
    f"<td>{item.get('Description', 'N/A')}</td>"
    f"<td>{item.get('File', 'N/A')}</td>"
    f"<td>{item.get('Line', 'N/A')}</td>"
    "</tr>"
    for item in findings
)

html_content = f"""<!DOCTYPE html>
<html>
  <head>
    <meta charset=\"utf-8\">
    <title>Gitleaks Report</title>
  </head>
  <body>
    <h1>Gitleaks Report</h1>
    <p>Total findings: {len(findings)}</p>
    <table>
      <tr><th>Description</th><th>File</th><th>Line</th></tr>
      {rows}
    </table>
  </body>
</html>
"""

html_path.write_text(html_content)
print(f"Created report at {html_path}")
PYTHON
          cd reports
          zip -r gitleaks-report.zip gitleaks-report.html
          ls -R .
        fi

    - name: Upload HTML Report
      uses: actions/upload-artifact@v4
      with:
        name: gitleaks-html-report
        path: |
          reports/gitleaks-report.html
          reports/gitleaks-report.zip
