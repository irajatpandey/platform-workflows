name: Common Setup
description: Common setup for CI pipelines

inputs:
  python-version:
    description: Python version
    required: false
    default: "3.12"
  java-version:
    description: Java version
    required: false
    default: "17"
  setup-python:
    description: Whether to setup Python
    required: false
    default: "true"
  setup-java:
    description: Whether to setup Java
    required: false
    default: "false"
  install-gitleaks:
    description: Whether to install Gitleaks
    required: false
    default: "false"

runs:
  using: composite

  steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      if: ${{ inputs.setup-python == 'true' }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup Java
      if: ${{ inputs.setup-java == 'true' }}
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Install Gitleaks
      if: ${{ inputs.install-gitleaks == 'true' }}
      shell: bash
      run: |
        set -e
        curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
        tar -xzf /tmp/gitleaks.tar.gz -C /tmp
        chmod +x /tmp/gitleaks
        sudo install /tmp/gitleaks /usr/local/bin/gitleaks
        gitleaks version

    - name: Print Python Version
      if: ${{ inputs.setup-python == 'true' }}
      shell: bash
      run: python --version

    - name: Print Java Version
      if: ${{ inputs.setup-java == 'true' }}
      shell: bash
      run: java -version