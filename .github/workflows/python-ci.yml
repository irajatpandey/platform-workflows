name: python-ci-pipeline 

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version
        required: false
        type: string
        default: "3.12"
      java-version:
        description: Java version
        required: false
        type: string
        default: "17"

jobs:
  checkout-code:
    name: Checkout Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

  setup-python:
    name: Setup Python
    runs-on: ubuntu-latest
    needs: checkout-code
    steps:
      - uses: actions/checkout@v4
      - name: Run shared setup
        uses: irajatpandey/platform-workflows/.github/actions/common-setup@master
        with:
          python-version: ${{ inputs.python-version }}
          setup-python: "true"
          setup-java: "false"
          install-gitleaks: "false"

  setup-java:
    name: Setup Java
    runs-on: ubuntu-latest
    needs: checkout-code
    steps:
      - uses: actions/checkout@v4
      - name: Run shared setup
        uses: irajatpandey/platform-workflows/.github/actions/common-setup@master
        with:
          java-version: ${{ inputs.java-version }}
          setup-python: "false"
          setup-java: "true"
          install-gitleaks: "false"

  gitleaks:
    name: Gitleaks Scan and Report
    runs-on: ubuntu-latest
    needs: [setup-python, setup-java]
    steps:
      - uses: actions/checkout@v4
      - name: Run shared setup
        uses: irajatpandey/platform-workflows/.github/actions/common-setup@master
        with:
          setup-python: "false"
          setup-java: "false"
          install-gitleaks: "true"
     