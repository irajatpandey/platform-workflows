name: python-ci-pipeline

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version
        required: false
        type: string
        default: "3.12"

      exclusions:
        description: Sonar exclusions
        required: false
        type: string
        default: ""

      java-version:
        description: Java version
        required: false
        type: string
        default: "17"

      run-sonar:
        description: Run SonarQube analysis
        required: false
        type: boolean
        default: true

      sonar-project-key:
        description: Sonar project key (defaults to owner_repo)
        required: false
        type: string
        default: ""

      sonar-project-name:
        description: Sonar project name (defaults to repo name)
        required: false
        type: string
        default: ""

      sonar-organization:
        description: Sonar organization (defaults to owner)
        required: false
        type: string
        default: ""

      sonar-sources:
        description: Sonar sources directory
        required: false
        type: string
        default: "."

      nexus-url:
        description: Nexus IQ Server URL
        required: false
        type: string
        default: ""

      nexus-app-id:
        description: Nexus Application ID
        required: false
        type: string
        default: ""

      nexus-stage:
        description: Nexus Lifecycle Stage (build, stage-release, release)
        required: false
        type: string
        default: "build"

    secrets:
      SONAR_TOKEN:
        required: false
      NEXUS_USERNAME:
        required: false
      NEXUS_PASSWORD:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  python-ci:
    name: Python CI
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Setup Python
        uses: irajatpandey/platform-workflows/.github/actions/steps/setup-python@master
        with:
          python-version: ${{ inputs.python-version }}

      - name: Setup Java
        uses: irajatpandey/platform-workflows/.github/actions/steps/setup-java@master
        with:
          java-version: ${{ inputs.java-version }}

      - name: Run Gitleaks
        uses: irajatpandey/platform-workflows/.github/actions/steps/run-gitleaks@master

      - name: Upload HTML Report
        uses: irajatpandey/platform-workflows/.github/actions/steps/upload-artifact@master

      - name: Run Unit Tests and Code Coverage
        shell: bash
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

          pytest \
            --junitxml=test-results.xml \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

      - name: SAST / SonarQube Analysis
        uses: irajatpandey/platform-workflows/.github/actions/steps/sonarqube@master
        with:
          project-key: ${{ inputs.sonar-project-key != '' && inputs.sonar-project-key || format('{0}_{1}', github.repository_owner, github.event.repository.name) }}
          project-name: ${{ inputs.sonar-project-name != '' && inputs.sonar-project-name || github.event.repository.name }}
          organization: ${{ inputs.sonar-organization != '' && inputs.sonar-organization || github.repository_owner }}
          sources: ${{ inputs.sonar-sources }}
          exclusions: ${{ inputs.exclusions }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}

      - name: Upload SonarQube HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-html-report
          path: |
            reports/sonarqube-report.html
            reports/sonarqube-report.zip

      - name: Publish SonarQube HTML Report to GitHub Pages
        if: always()
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          destination_dir: sonar-reports
          keep_files: true

      - name: Nexus IQ Policy Scan
        uses: irajatpandey/platform-workflows/.github/actions/steps/nexus-scan@master
        with:
          nexus-url: ${{ inputs.nexus-url }}
          application-id: ${{ inputs.nexus-app-id != '' && inputs.nexus-app-id || github.event.repository.name }}
          stage: ${{ inputs.nexus-stage }}
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Upload Nexus Scan Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-report
          path: |
            reports/nexus-*

      - name: Checkov IaC / Dockerfile Security Scan
        uses: irajatpandey/platform-workflows/.github/actions/steps/checkov@master

      - name: Upload Checkov Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: |
            reports/checkov-*

      - name: Build & Push Docker Image to Registry
        uses: irajatpandey/platform-workflows/.github/actions/steps/docker-build-push@master
        with:
          image-name: ${{ github.event.repository.name }}
          image-tag: ${{ github.sha }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}